[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "GraphGen"
version = "0.1.0"
dependencies = [
    "requests>=2.31.0",
    "torch==2.6.0",
    "omegaconf",
    "numpy",
    "tqdm",
    "wandb",
    "pandas",
    "networkx",
    "matplotlib",
    "seaborn",
    "scipy",
    "PyQt5",
    "tensorboard",
    "tensorboardX",
    "tbparse",
    "bidict",
    "PrettyPrintTree",
    "pybind11",
    # scikit-build-core's editable-install rebuild shim shells out to `cmake`
    # (and `ninja`) at *import* time whenever a source file changes. Pin them
    # as runtime deps so the venv always has them, no brew prerequisite.
    # scikit-build-core itself is pinned here (not only in [build-system])
    # because install.sh uses --no-build-isolation, and because the same
    # persistent venv is what runs the editable rebuild.
    #
    # scikit-build itself requires Ninja as its CMake generator; pinning it
    # here means users don't have to install it separately via brew/apt.
    "scikit-build-core>=0.10",
    "cmake>=3.24",
    "ninja",
]
requires-python = ">=3.10,<3.11"

[project.optional-dependencies]
# Install with: uv pip install -e ".[dev]"   (or  pip install -e ".[dev]")
# Provides the pytest + benchmark harnesses under tests/ and old_tests/.
dev = [
    "pytest>=8",
    "pytest-benchmark>=4",
]

# --- scikit-build-core --------------------------------------------------------
# Drives CMake for the C++ extension. `editable.rebuild = true` makes
# `import generator` re-run `cmake --build` transparently, so C++ edits are
# picked up without any manual step.

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.24"
build-dir = "build/{wheel_tag}"
# Package layout: only the C++ extension ships. No Python packages.
wheel.packages = []
wheel.py-api = "cp310"

[tool.scikit-build.editable]
mode = "redirect"
rebuild = true
verbose = false

# --- pytest -----------------------------------------------------------------
# Put the repo root on sys.path so tests can `import get_generator_module`
# without a package layout.
#
# `testpaths` restricts collection to tests/ only. The old_tests/ tree
# exercises the retired V1 C++ API and is kept solely so its recorded
# baseline JSON can be replayed against the new framework for timing
# comparison once the pipeline is complete.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
